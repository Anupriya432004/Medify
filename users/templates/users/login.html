{% extends "core/base.html" %}

{% block content %}
<section class="auth-form">
    <h1>Log In</h1>
    {% if form.errors %}
        <p class="auth-errors">Your username and password did not match. Please try again.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {{ form.as_p }}
        <button class="auth-submit" type="submit">Log In</button>
    </form>
    <p>Don't have an account? <a href="{% url 'users:register' %}?next={{ next|urlencode }}">Create one</a>.</p>
</section>
{% endblock %}
